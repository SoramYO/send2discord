<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Send Image to Discord - Options</title>
  <style>
    body { font-family: system-ui; margin: 24px; max-width: 640px }
    label { display: block; margin: 12px 0 6px }
    input[type="text"] { width: 100%; padding: 10px; box-sizing: border-box }
    .row { margin-top: 12px; display: flex; gap: 12px; align-items: center }
    button { padding: 8px 14px; cursor: pointer }
    .hint { font-size: 12px; color: #666; margin-top: 6px }
  </style>
</head>
<body>
  <h1>Cấu hình</h1>
  <label>Discord Webhook URL</label>
  <input type="text" id="webhookUrl" placeholder="https://discord.com/api/webhooks/..." />
  <div class="row">
    <input type="checkbox" id="sendAsFile" />
    <label for="sendAsFile">Gửi dưới dạng file</label>
  </div>
  <div class="row">
    <input type="checkbox" id="addPageInfo" checked />
    <label for="addPageInfo">Đính kèm thông tin trang nguồn</label>
  </div>
  <div class="row">
    <button id="save">Lưu</button>
    <span id="status"></span>
  </div>
  <p class="hint">Tạo Webhook trong Discord: Channel ➜ Edit ➜ Integrations ➜ Webhooks ➜ New Webhook ➜ Copy URL.</p>
  <script src="options.js"></script>
</body>
</html>
